<div class="content">
    <div class="box contentbox">
        <div class="box">
            <div class="flexbox space-8 middle">
                <div class="wide sandbox-snippet-header">
                    <div class="flexbox space-8 middle">
                        <div class="sandbox-snippet-text">
                            <div id="snippet-name-display" class="bold nowrap"></div>
                            <p id="snippet-desc-display" class="hint custom-mt-2 nowrap"></p>
                        </div>
                        <span id="access-icon" class="sandbox-access-icon" title="{_w('Private')|escape}"><i class="fas fa-lock text-yellow"></i></span>
                    </div>
                </div>
                <div>
                    <div class="wa-select">
                        <select id="environment-select">
                            <option value="">— {_w('No environment')|escape} —</option>
                            {foreach $environments as $env}
                            <option value="{$env.id}">{$env.name|escape}</option>
                            {/foreach}
                        </select>
                    </div>
                </div>
                <div>
                    <a href="?module=backend&action=catalog" class="button light-gray">{_w('Snippet catalog')|escape}</a>
                    <a href="?module=backend&action=environments" class="button light-gray">{_w('Environments')|escape}</a>
                </div>
            </div>
        </div>

        <div class="box">
            <div class="flexbox space-8 middle">
                <div>
                    <div class="wa-select">
                        <select id="recent-snippets">
                            <option value="">— {_w('Recent snippets')|escape} —</option>
                            {foreach $recent_snippets as $s}
                            <option value="{$s.id}" class="js-load-snippet">{$s.name|escape}</option>
                            {/foreach}
                        </select>
                    </div>
                </div>
                <div>
                    <label class="inline-block">
                        <span class="wa-checkbox">
                            <input type="checkbox" id="smarty-toggle">
                            <span>
                                <span class="icon">
                                    <i class="fas fa-check"></i>
                                </span>
                            </span>
                        </span>
                        Smarty
                    </label>
                </div>
                <div class="wide"></div>
                <div id="execution-time" class="sandbox-execution-time"></div>
            </div>
        </div>

        <div class="sandbox-editor-layout">
            <div class="sandbox-editors-column">
                <div class="sandbox-editor-box box shadowed">
                    <div class="box small"><strong>PHP</strong></div>
                    <div class="sandbox-editor-container" id="php-editor"></div>
                </div>

                <div id="smarty-editor-wrapper" class="sandbox-editor-box box shadowed" style="display:none">
                    <div class="box small flexbox middle">
                        <strong class="wide">Smarty</strong>
                        {$wa->getCheatSheetButton(['name' => 'sandbox_smarty', 'app' => 'sandbox', 'key' => 'sandbox_smarty'])}
                    </div>
                    <div class="sandbox-editor-container" id="smarty-editor"></div>
                </div>

                <div class="box sandbox-editor-footer">
                    <button type="button" id="btn-execute" class="button green"><i class="fas fa-play"></i> {_w('Run')|escape}</button>
                    <button type="button" id="btn-save" class="button blue"><i class="fas fa-save"></i> {_w('Save')|escape}</button>
                    <button type="button" id="btn-duplicate" class="button light-gray" style="display:none"><i class="fas fa-copy"></i> {_w('Duplicate')|escape}</button>
                    <button type="button" id="btn-new" class="button light-gray">{_w('New')|escape}</button>
                </div>
            </div>

            <div class="sandbox-result-column">
                <div class="sandbox-result-box box shadowed">
                    <div class="box small flexbox middle space-8">
                        <strong class="wide">{_w('Result')|escape}</strong>
                        <button type="button" id="btn-clear-result" class="button light-gray small">{_w('Clear')|escape}</button>
                        <button type="button" id="btn-copy-result" class="button light-gray small">{_w('Copy')|escape}</button>
                    </div>
                    <div id="result-output" class="sandbox-result-panel box small"></div>
                    <div id="result-errors" class="sandbox-error box" style="display:none"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="{$wa_app_static_url}js/vendor/ace/ace.js"></script>
<script src="{$wa_app_static_url}js/vendor/ace/mode-php.js"></script>
<script src="{$wa_app_static_url}js/vendor/ace/mode-smarty.js"></script>
<script>ace.config.set('basePath', '{$wa_app_static_url}js/vendor/ace/');</script>
<script>
$(() => {
    const sandboxEditor = new SandboxEditor({
        folders: {$folders|json_encode},
        l10n: {
            execute_label:     {_w('Run')|json_encode:256},
            copied:            {_w('Copied!')|json_encode:256},
            no_output:         {_w('No output')|json_encode:256},
            dialog_header:     {_w('Save snippet')|json_encode:256},
            name_label:        {_w('Name')|json_encode:256},
            desc_label:        {_w('Description')|json_encode:256},
            folder_label:      {_w('Folder')|json_encode:256},
            no_folder:         {_w('— No folder —')|json_encode:256},
            shared_label:      {_w('Shared with everyone')|json_encode:256},
            save_as_new_label: {_w('Save as new')|json_encode:256},
            save_btn:          {_w('Save')|json_encode:256},
            cancel:            {_w('Cancel')|json_encode:256},
            name_required:     {_w('Enter a snippet name')|json_encode:256},
            access_shared:     {_w('Shared')|json_encode:256},
            access_personal:   {_w('Private')|json_encode:256},
            saved:             {_w('Snippet saved')|json_encode:256},
            save_error:        {_w('Error while saving')|json_encode:256},
            duplicated:        {_w('Snippet duplicated')|json_encode:256},
        },
    });
    sandboxEditor.init();

    // Скрыть кнопку «Переменные» — нужна только «Шпаргалка»
    $('#smarty-editor-wrapper .js-show-variables').hide();

    if ($.cheatsheet && $.cheatsheet.sandbox_smarty) {
        $.cheatsheet.sandbox_smarty.insertVarEvent = function ($drawer) {
            $drawer.on('click', '.js-var', function (e) {
                e.preventDefault();
                sandboxEditor.smartyEditor.insert($(this).text());
                sandboxEditor.smartyEditor.focus();
            });
        };
    }
});
</script>
